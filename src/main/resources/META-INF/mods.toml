modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="aetasferrea_mod.webp"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="jade"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

[[dependencies."${mod_id}"]]
    modId="controlling"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"

[[dependencies."${mod_id}"]]
    modId="searchables"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"