// ---------- GRADLE PLUGINS
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.modrinth.minotaur' version '2.9.0'
    id 'net.darkhax.curseforgegradle' version '1.1.24'
}

// ---------- GRADLE SETTINGS
version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// ---------- MINECRAFT SETTINGS
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            ideaModule "${project.name}.test"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.test
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// ---------- MIXING SETTINGS
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---------- REPOSITORIES
repositories {
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroup "org.spongepowered"
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.blamejared.com"
        content {
            includeGroup "com.blamejared.controlling"
            includeGroup "com.blamejared.searchables"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven {
        url = "https://maven.kosmx.dev/"
        content {
            includeGroup "dev.kosmx.player-anim"
        }
    }
}

// ---------- DEPENDENCIES
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Jade Integration
    implementation fg.deobf(libs.jade.get())

    // Farmer's Delight
    implementation fg.deobf(libs.farmers.delight.get())

    // Spartan Weaponry
    implementation fg.deobf(libs.spartan.weaponry.get())

    // Enhanced AI
    compileOnly fg.deobf(libs.enhanced.ai.get())
    
    // Combat Roll
    compileOnly fg.deobf(libs.combat.roll.get())
    
    // Better Combat
    compileOnly fg.deobf(libs.better.combat.get())
    
    // Controlling
    implementation fg.deobf(libs.controlling.get())
    
    // Searchables (Required by Controlling)
    implementation fg.deobf(libs.searchables.get())

    // Transitively required by compileOnly dependencies (for VSCode/IDE classpath support)
    compileOnly fg.deobf(libs.cloth.config.get())
    compileOnly fg.deobf(libs.player.anim.get())
    compileOnly fg.deobf(libs.insanelib.get())

    // Testing Dependencies
    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testImplementation libs.mockito.core
}

// ---------- RESOURCES
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ---------- JAR CONFIGURATION
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// ---------- JAVA COMPILATION
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------- TESTING
test {
    useJUnitPlatform()
}

// ---------- PUBLISHING
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// Modrinth Publishing Configuration
modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = "aetas-ferrea-lib"
    versionNumber = project.version
    versionType = "release"
    uploadFile = jar
    gameVersions = [minecraft_version]
    loaders = ["forge"]
}

// CurseForge Publishing Configuration
task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    def projectId = "123456" // Replace with your numeric CurseForge project ID
    def mainFile = upload(projectId, jar)
    mainFile.changelog = "Release ${project.version}"
    mainFile.releaseType = 'release'
    mainFile.addGameVersion(minecraft_version)
    mainFile.addJavaVersion('Java 17')
}